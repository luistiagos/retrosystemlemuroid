# Gradle
org.gradle.user.home=E:/.gradle
org.gradle.parallel=true
org.gradle.daemon=true
# java.io.tmpdir aponta para o E: porque o C: vive ~100% cheio e o build escreve
# arquivos grandes de temp (AAPT2/resource link/packaging) no java.io.tmpdir.
# O diretório E:/gradle_tmp é criado pelo build_apk.ps1 (precisa existir).
org.gradle.jvmargs=-Xmx2560m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapBaseMinAddress=34359738368 -Dfile.encoding=UTF-8 -Djava.io.tmpdir=E:/gradle_tmp
org.gradle.java.home=C:\\Android\\Android Studio\\jbr
org.gradle.caching=true
# https://github.com/gradle/kotlin-dsl/issues/311
org.gradle.configureondemand=false
# Kotlin
kotlin.incremental.usePreciseJavaTracking=true
# Android
android.builder.sdkDownload=true
android.enableD8.desugaring=true
# AndroidX
android.useAndroidX=true
android.enableJetifier=true
org.gradle.configuration-cache=false